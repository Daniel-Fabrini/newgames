<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="PlayVerse — 10 minijogos em um só lugar: Block Puzzle, Water Sort, Snake, Number Match, Paciência, Damas, Dominó, Sudoku, 2048 e Palavras Cruzadas." />
    <meta name="theme-color" content="#0b0a2a" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PlayVerse" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>PlayVerse</title>
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      (function () {
        try {
          var raw = localStorage.getItem('playverse:settings');
          var theme = (raw && (JSON.parse(raw).d || {}).theme) || 'dark';
          var dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          /* storage unavailable: keep default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>O PlayVerse precisa de JavaScript. · PlayVerse requires JavaScript. · PlayVerse necesita JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
